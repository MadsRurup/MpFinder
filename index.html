<!doctype html>
<html data-bs-theme="dark">
    <head>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

        <style>
            body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <div
                class="row justify-content-center align-items-center min-vh-100"
            >
                <!-- LEFT: FORM -->
                <div class="col-md-6">
                    <div
                        class="card shadow-lg border-dark-subtle"
                        style="height: 650px"
                    >
                        <div class="card-body p-4">
                            <div
                                class="d-flex justify-content-between align-items-center"
                            >
                                <h3 class="text-center mb-4">MP Link Finder</h3>
                                <div>
                                    <h6>Check Interval</h6>
                                    <input
                                        onchange="updateInterval()"
                                        type="number"
                                        id="interval"
                                        class="form-control mw-50"
                                        value="200"
                                    />
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Lobby Name</label>
                                <input
                                    type="text"
                                    id="lobbyName"
                                    class="form-control"
                                    value=""
                                />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Retries</label>
                                <input
                                    type="number"
                                    id="retries"
                                    class="form-control"
                                    value="50"
                                />
                            </div>

                            <div class="mb-3">
                                <label class="form-label d-block"
                                    >Search Method</label
                                >

                                <div class="form-check form-check-inline">
                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="scrapeMethod"
                                        value="id"
                                        id="idSelect"
                                        checked
                                    />
                                    <label class="form-check-label">ID</label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="scrapeMethod"
                                        value="date"
                                        id="dateSelect"
                                    />
                                    <label class="form-check-label">Date</label>
                                </div>
                            </div>

                            <div id="idForm" class="mb-3">
                                <label class="form-label">Start ID</label>
                                <input
                                    type="number"
                                    id="start"
                                    class="form-control"
                                />
                            </div>

                            <div id="dateForm" class="mb-3">
                                <div
                                    class="d-flex justify-content-between align-items-center"
                                >
                                    <label class="form-label"
                                        >Select Date & Time</label
                                    >
                                    <span
                                        ><label>Backwards</label>
                                        <input
                                            onchange="backwards = !backwards"
                                            type="checkbox"
                                            id="backwards"
                                            checked
                                    /></span>
                                </div>
                                <input
                                    type="datetime-local"
                                    id="date"
                                    class="form-control"
                                />
                                <br />
                                <label class="form-label"
                                    >Id near wanted. (Must be newer)</label
                                >
                                <input
                                    type="number"
                                    id="nearId"
                                    class="form-control"
                                    value=""
                                />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">API Key</label>
                                <input
                                    type="text"
                                    id="apiKey"
                                    class="form-control"
                                    value=""
                                />
                            </div>

                            <div class="d-grid">
                                <button
                                    onclick="startSearch()"
                                    class="btn btn-primary mt-1"
                                >
                                    Search
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- RIGHT: TERMINAL -->
                <div class="col-md-6">
                    <div
                        class="card shadow-lg border-dark-subtle"
                        style="height: 650px"
                    >
                        <div class="card-body p-3 d-flex flex-column h-100">
                            <h5 class="mb-3 text-center">Output Terminal</h5>

                            <!-- SCROLL AREA -->
                            <div
                                id="terminal"
                                class="flex-grow-1 overflow-auto bg-dark p-2 rounded border border-dark-subtle"
                            ></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            let backwards = true;
            let interval = document.getElementById("interval").value;
            function updateInterval() {
                interval = document.getElementById("interval").value;
            }
            document
                .getElementById("idSelect")
                .addEventListener("click", updateSelection);
            document
                .getElementById("dateSelect")
                .addEventListener("click", updateSelection);

            function updateSelection() {
                const selected = document.querySelector(
                    'input[name="scrapeMethod"]:checked',
                );
                switch (selected.value) {
                    case "id":
                        document.getElementById("idForm").style.display =
                            "block";
                        document.getElementById("dateForm").style.display =
                            "none";
                        break;
                    case "date":
                        document.getElementById("idForm").style.display =
                            "none";
                        document.getElementById("dateForm").style.display =
                            "block";
                        break;
                    default:
                        break;
                }
            }
            updateSelection();
            let API_KEY = null;

            async function checkMatch(id) {
                const url = `https://osu.ppy.sh/api/get_match?k=${API_KEY}&mp=${id}`;
                try {
                    const res = await fetch(url);
                    const data = await res.json();
                    if (!data || !data.match) return false;

                    // Example condition:
                    const parent = document.createElement("div");
                    const paragraf = document.createElement("p");
                    const link = `<a href="https://osu.ppy.sh/community/matches/${id}"">https://osu.ppy.sh/community/matches/${id}</a>`;
                    paragraf.innerHTML = "" + data.match.name + " " + link;
                    parent.appendChild(paragraf);

                    appendToTerminalScroll(parent);
                    if (
                        data.match.name.includes(
                            document.getElementById("lobbyName").value,
                        )
                    ) {
                        console.log("Found match:", id, data);
                        return true;
                    }
                } catch (e) {
                    console.log("Error at ID:", id);
                }

                return false;
            }

            async function checkMatchDate(id) {
                const url = `https://osu.ppy.sh/api/get_match?k=${API_KEY}&mp=${id}`;
                try {
                    const res = await fetch(url);
                    const data = await res.json();
                    if (!data || !data.match) return false;

                    // Example condition:
                    return data.match.start_time;
                } catch (e) {
                    console.log("Error at ID:", id);
                }

                return false;
            }

            async function startSearch() {
                API_KEY = document.getElementById("apiKey").value;
                let start = Number(document.getElementById("start").value); // adjust range
                let retries = Number(document.getElementById("retries").value);
                const selected = document.querySelector(
                    'input[name="scrapeMethod"]:checked',
                );
                switch (selected.value) {
                    case "id":
                        checkFromId(start, retries);
                        break;
                    case "date":
                        const date = document.getElementById("date").value;
                        const nearId = document.getElementById("nearId").value;
                        const idToCheckFrom = await getIdByDate(
                            date,
                            Number(nearId),
                        );
                        checkFromId(idToCheckFrom, retries);
                        break;
                    default:
                        break;
                }
            }

            async function getIdByDate(targetDate, nearId) {
                const target = new Date(targetDate);

                let low = Math.max(1, nearId - 800000);
                let high = nearId + 1000;

                let bestId = null;
                let bestDiff = Infinity;

                while (low <= high) {
                    const mid = Math.floor((low + high) / 2);

                    const matchTimeStr = await checkMatchDate(mid);
                    const parent = document.createElement("div");
                    const paragraf = document.createElement("p");
                    paragraf.innerHTML =
                        "Closing in on date. Currently at " + matchTimeStr;
                    parent.appendChild(paragraf);
                    appendToTerminalScroll(parent);

                    // skip invalid IDs
                    if (!matchTimeStr) {
                        low = mid + 1;
                        continue;
                    }

                    const matchTime = new Date(matchTimeStr);
                    const diff = Math.abs(matchTime - target);

                    // track nearest match
                    if (diff < bestDiff) {
                        bestDiff = diff;
                        bestId = mid;
                    }

                    // binary search direction
                    if (matchTime < target) {
                        low = mid + 1;
                    } else {
                        high = mid - 1;
                    }

                    // rate limit safety
                    await new Promise((r) => setTimeout(r, interval));
                }
                const parent = document.createElement("div");
                const paragraf = document.createElement("p");
                paragraf.innerHTML = "Found nearest match";
                parent.appendChild(paragraf);
                appendToTerminalScroll(parent);
                return bestId;
            }

            async function checkFromId(start, retries) {
                for (let i = 0; i < retries; i++) {
                    let currentId = null;
                    const selected = document.querySelector(
                        'input[name="scrapeMethod"]:checked',
                    );
                    if (backwards && selected.value == "date") {
                        currentId = start - i;
                        console.log("test");
                    } else {
                        currentId = start + i;
                    }

                    const found = await checkMatch(currentId);

                    if (found) {
                        alert("Found match at ID " + currentId);
                        break;
                    }

                    // small delay to avoid rate limit
                    await new Promise((r) => setTimeout(r, interval));
                }
            }
            function appendToTerminalScroll(element) {
                const terminal = document.getElementById("terminal");

                // check if user is near bottom (within 5px)
                const isAtBottom =
                    terminal.scrollHeight -
                        terminal.scrollTop -
                        terminal.clientHeight <
                    5;

                console.log("Bottom:", isAtBottom);

                appendToTerminal(element);

                // only auto-scroll if already at bottom
                if (isAtBottom) {
                    terminal.scrollTop = terminal.scrollHeight;
                }
            }
            function appendToTerminal(element) {
                document.getElementById("terminal").appendChild(element);
            }
        </script>
    </body>
</html>
